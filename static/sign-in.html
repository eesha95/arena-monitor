<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Arena Monitor</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/landing.css">
<script>
  (function () {
    var pref = 'light';
    try { var v = localStorage.getItem('am.theme'); if (v) pref = JSON.parse(v); } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  .signin-wrap { min-height: calc(100vh - 140px); display: grid; place-items: center; padding: 32px 16px; }
  .signin-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; text-align: center; }
  .signin-card h1 { font-size: 24px; margin: 0 0 8px; }
  .signin-card p { color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body class="lp">
<header class="lp-nav">
  <a class="lp-logo" href="/"><span class="logo">◆</span> Arena Monitor</a>
</header>
<main class="signin-wrap">
  <div class="signin-card" id="signin">
    <h1>Sign-in is being set up</h1>
    <p>Google, Discord and email sign-in are coming. Until then, the dashboard is open to everyone.</p>
    <a class="btn btn-primary" href="/app">Open the dashboard</a>
  </div>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Arena Monitor</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/landing.css">
<script>
  (function () {
    var pref = 'light';
    try { var v = localStorage.getItem('am.theme'); if (v) pref = JSON.parse(v); } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  .signin-wrap { min-height: calc(100vh - 140px); display: grid; place-items: center; padding: 32px 16px; }
  .signin-intro { text-align: center; margin-bottom: 18px; }
  .signin-intro h1 { font-size: 26px; margin: 0 0 6px; }
  .signin-intro p { color: var(--muted); margin: 0; }
  .signin-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; text-align: center; }
  .signin-card p { color: var(--muted); margin: 0 0 20px; }
  #clerkSignIn { display: flex; justify-content: center; min-height: 120px; }
  .signin-status { color: var(--muted); font-size: 14px; text-align: center; margin-top: 10px; }
</style>
</head>
<body class="lp">
<header class="lp-nav">
  <a class="lp-logo" href="/"><span class="logo">◆</span> Arena Monitor</a>
</header>
<main class="signin-wrap">
  <div>
    <div class="signin-intro">
      <h1>Sign in to Arena Monitor</h1>
      <p>Use Google, Discord or a one-time code sent to your email.</p>
    </div>
    <div id="clerkSignIn" aria-live="polite"></div>
    <p class="signin-status" id="status">Loading sign-in…</p>
  </div>
</main>
<script src="/auth.js"></script>
<script>
  (async function () {
    const status = document.getElementById('status');
    try {
      const auth = await window.AM_AUTH;
      if (!auth.enabled) {
        document.querySelector('.signin-wrap').innerHTML =
          '<div class="signin-card"><h1>Sign-in is off</h1><p>This copy of Arena Monitor does not require sign-in.</p>' +
          '<a class="btn btn-primary" href="/app">Open the dashboard</a></div>';
        return;
      }
      if (auth.clerk.isSignedIn) { location.replace('/app'); return; }
      auth.clerk.mountSignIn(document.getElementById('clerkSignIn'), {
        fallbackRedirectUrl: '/app',
        signUpFallbackRedirectUrl: '/app',
      });
      status.textContent = '';
    } catch (e) {
      status.textContent = 'Sign-in could not load (' + e.message + '). Check your connection and reload.';
    }
  })();
</script>
</body>
</html>
